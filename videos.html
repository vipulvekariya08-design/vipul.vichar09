<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta
    name="description"
    content="Watch literary videos, reflections, readings and thoughts by Vipul Vekariya."
  >

  <meta name="author" content="Vipul Vekariya">

  <title>Videos | Vipul Vekariya</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    :root {
      --video-bg: #f5f0e6;
      --video-paper: #fffdf8;
      --video-ink: #24211d;
      --video-muted: #746d64;
      --video-border: #d8d0c2;
      --video-accent: #806344;
      --video-dark: #211f1b;
    }

    body {
      background: var(--video-bg);
      color: var(--video-ink);
    }

    .videos-page {
      padding: 65px 0 90px;
    }

    .videos-wrap {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    /* HERO */

    .videos-hero {
      max-width: 760px;
      margin: 0 auto 45px;
      text-align: center;
    }

    .videos-kicker {
      margin-bottom: 13px;
      color: var(--video-accent);
      font-family: Arial, sans-serif;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .videos-title {
      margin: 0 0 18px;

      font-family:
        Georgia,
        "Noto Serif Gujarati",
        "Noto Serif Devanagari",
        serif;

      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 1.05;
      font-weight: 500;
    }

    .videos-intro {
      max-width: 650px;
      margin: 0 auto;

      color: var(--video-muted);

      font-family:
        Arial,
        "Noto Sans Gujarati",
        "Noto Sans Devanagari",
        sans-serif;

      font-size: 1rem;
      line-height: 1.8;
    }

    /* FILTERS */

    .video-filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;

      margin-bottom: 42px;
    }

    .video-filter {
      border: 1px solid var(--video-border);
      background: var(--video-paper);
      color: var(--video-ink);

      padding: 10px 18px;
      border-radius: 30px;

      font-size: .9rem;
      cursor: pointer;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
    }

    .video-filter:hover,
    .video-filter.active {
      background: var(--video-dark);
      color: #fff;
      border-color: var(--video-dark);
    }

    /* GRID */

    .videos-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 30px;
    }

    /* CARD */

    .video-card {
      overflow: hidden;

      background: var(--video-paper);

      border:
        1px solid
        var(--video-border);

      border-radius: 6px;

      box-shadow:
        0 14px 35px
        rgba(50, 40, 25, .07);
    }

    /* VIDEO */

    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;

      background: #111;
    }

    .video-frame iframe {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
    }

    /* DETAILS */

    .video-details {
      padding: 25px 25px 27px;
    }

    .video-category {
      margin-bottom: 10px;

      color: var(--video-accent);

      font-family: Arial, sans-serif;
      font-size: .7rem;
      font-weight: 700;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .video-name {
      margin: 0 0 12px;

      font-family:
        Georgia,
        "Noto Serif Gujarati",
        "Noto Serif Devanagari",
        serif;

      font-size: 1.45rem;
      line-height: 1.35;
      font-weight: 500;
    }

    .video-description {
      margin: 0;

      color: var(--video-muted);

      font-family:
        Arial,
        "Noto Sans Gujarati",
        "Noto Sans Devanagari",
        sans-serif;

      font-size: .9rem;
      line-height: 1.7;
    }

    .video-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-top: 22px;
      padding-top: 18px;

      border-top:
        1px solid
        var(--video-border);
    }

    .video-language {
      color: var(--video-muted);

      font-family: Arial, sans-serif;
      font-size: .72rem;

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .video-link {
      color: var(--video-accent);

      font-family: Arial, sans-serif;
      font-size: .8rem;
      font-weight: 700;

      text-decoration: none;
    }

    .video-link:hover {
      text-decoration: underline;
    }

    /* EMPTY / ERROR MESSAGE */

    .videos-message {
      grid-column: 1 / -1;

      padding: 55px 20px;

      text-align: center;

      color: var(--video-muted);

      font-family: Arial, sans-serif;
    }

    /* BOTTOM NOTE */

    .videos-note {
      max-width: 720px;

      margin: 55px auto 0;
      padding-top: 25px;

      border-top:
        1px solid
        var(--video-border);

      text-align: center;

      color: var(--video-muted);

      font-family: Arial, sans-serif;
      font-size: .8rem;
      line-height: 1.7;
    }

    /* TABLET */

    @media (max-width: 850px) {

      .videos-grid {
        grid-template-columns: 1fr;
      }

      .video-card {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }

    }

    /* MOBILE */

    @media (max-width: 600px) {

      .videos-page {
        padding: 45px 0 70px;
      }

      .videos-hero {
        margin-bottom: 34px;
      }

      .videos-title {
        font-size:
          clamp(2.5rem, 13vw, 4rem);
      }

      .video-filters {
        margin-bottom: 30px;
      }

      .video-details {
        padding: 22px 20px 24px;
      }

      .video-name {
        font-size: 1.3rem;
      }

    }

  </style>
</head>


<body>


<main class="videos-page">

  <div class="videos-wrap">


    <!-- HERO -->

    <header class="videos-hero">

      <div class="videos-kicker">
        Watch · Listen · Reflect
      </div>

      <h1 class="videos-title">
        Videos
      </h1>

      <p class="videos-intro">
        Watch literary reflections, thoughts,
        readings and conversations by Vipul Vekariya
        in English, ગુજરાતી and हिन्दी.
      </p>

    </header>


    <!-- LANGUAGE FILTERS -->

    <div
      class="video-filters"
      aria-label="Filter videos by language"
    >

      <button
        class="video-filter active"
        data-language="All"
        type="button"
      >
        All
      </button>

      <button
        class="video-filter"
        data-language="English"
        type="button"
      >
        English
      </button>

      <button
        class="video-filter"
        data-language="Gujarati"
        type="button"
      >
        ગુજરાતી
      </button>

      <button
        class="video-filter"
        data-language="Hindi"
        type="button"
      >
        हिन्दी
      </button>

    </div>


    <!-- VIDEO GRID -->

    <section
      id="videosGrid"
      class="videos-grid"
      aria-live="polite"
    >

      <div class="videos-message">
        Loading videos…
      </div>

    </section>


    <div class="videos-note">

      Videos presented here are part of the
      official literary work and reflections
      of Vipul Vekariya.

    </div>


  </div>

</main>


<!-- EXISTING SITE HEADER / FOOTER -->

<script src="js/app.js"></script>


<!-- VIDEO ENGINE -->

<script>

(function () {

  "use strict";


  const grid =
    document.getElementById("videosGrid");

  const buttons =
    document.querySelectorAll(".video-filter");


  let videos = [];

  let activeLanguage = "All";


  /* SAFE HTML */

  function escapeHTML(value) {

    return String(value ?? "")

      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* EXTRACT YOUTUBE ID */

  function getYouTubeID(url) {

    if (!url) {
      return "";
    }


    try {

      const parsed =
        new URL(url);


      /* youtu.be/VIDEO-ID */

      if (
        parsed.hostname === "youtu.be" ||
        parsed.hostname === "www.youtu.be"
      ) {

        return parsed.pathname
          .replace("/", "")
          .split("/")[0];

      }


      /* youtube.com/watch?v=VIDEO-ID */

      if (
        parsed.hostname.includes("youtube.com")
      ) {

        if (
          parsed.pathname === "/watch"
        ) {

          return (
            parsed.searchParams.get("v") ||
            ""
          );

        }


        /* youtube.com/shorts/VIDEO-ID */

        if (
          parsed.pathname.startsWith("/shorts/")
        ) {

          return (
            parsed.pathname
              .split("/")[2] ||
            ""
          );

        }


        /* youtube.com/embed/VIDEO-ID */

        if (
          parsed.pathname.startsWith("/embed/")
        ) {

          return (
            parsed.pathname
              .split("/")[2] ||
            ""
          );

        }

      }

    }

    catch (error) {

      console.error(
        "Invalid video URL:",
        url
      );

    }


    return "";

  }


  /* CREATE VIDEO CARD */

  function createVideoCard(item) {


    const videoID =
      getYouTubeID(item.url);


    if (!videoID) {

      return null;

    }


    const article =
      document.createElement("article");


    article.className =
      "video-card";


    article.innerHTML = `

      <div class="video-frame">

        <iframe

          src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoID)}"

          title="${escapeHTML(item.title)}"

          loading="lazy"

          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share
          "

          referrerpolicy="
            strict-origin-when-cross-origin
          "

          allowfullscreen

        ></iframe>

      </div>


      <div class="video-details">


        <div class="video-category">

          ${escapeHTML(
            item.category || "Video"
          )}

        </div>


        <h2 class="video-name">

          ${escapeHTML(item.title)}

        </h2>


        <p class="video-description">

          ${escapeHTML(
            item.description || ""
          )}

        </p>


        <div class="video-meta">


          <span class="video-language">

            ${escapeHTML(
              item.language
            )}

          </span>


          <a
            class="video-link"
            href="${escapeHTML(item.url)}"
            target="_blank"
            rel="noopener noreferrer"
          >

            Watch on YouTube ↗

          </a>


        </div>


      </div>

    `;


    return article;

  }


  /* DISPLAY VIDEOS */

  function displayVideos() {


    grid.innerHTML = "";


    const filtered =

      activeLanguage === "All"

        ? videos

        : videos.filter(

            function (item) {

              return String(
                item.language
              ).toLowerCase()

              ===

              activeLanguage
                .toLowerCase();

            }

          );


    if (!filtered.length) {


      grid.innerHTML = `

        <div class="videos-message">

          No videos have been published
          in this language yet.

        </div>

      `;


      return;

    }


    let displayed = 0;


    filtered.forEach(

      function (item) {


        const card =
          createVideoCard(item);


        if (card) {

          grid.appendChild(card);

          displayed++;

        }


      }

    );


    if (!displayed) {

      grid.innerHTML = `

        <div class="videos-message">

          No valid videos are available
          at the moment.

        </div>

      `;

    }

  }


  /* FILTERS */

  buttons.forEach(

    function (button) {


      button.addEventListener(

        "click",

        function () {


          activeLanguage =
            button.dataset.language;


          buttons.forEach(

            function (item) {

              item.classList.remove(
                "active"
              );

            }

          );


          button.classList.add(
            "active"
          );


          displayVideos();

        }

      );

    }

  );


  /* LOAD JSON */

  fetch(
    "data/videos.json",
    {
      cache: "no-store"
    }
  )

  .then(

    function (response) {


      if (!response.ok) {

        throw new Error(
          "Unable to load videos."
        );

      }


      return response.json();

    }

  )

  .then(

    function (data) {


      if (!Array.isArray(data)) {

        throw new Error(
          "videos.json must contain an array."
        );

      }


      videos = data;

      displayVideos();

    }

  )

  .catch(

    function (error) {


      console.error(error);


      grid.innerHTML = `

        <div class="videos-message">

          Videos could not be loaded.
          Please try again shortly.

        </div>

      `;

    }

  );


})();

</script>


</body>

</html>
